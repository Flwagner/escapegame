<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#d8d2bf"/>
  <rect x="42" y="42" width="816" height="1116" fill="#eee8d6" stroke="#4b4a43" stroke-width="5"/>
  <text x="450" y="120" text-anchor="middle" font-family="monospace" font-size="40" font-weight="bold" fill="#252522">CHAMBRE FROIDE 2</text>
  <text x="450" y="168" text-anchor="middle" font-family="monospace" font-size="25" fill="#7c1717">PROTOCOLE DE REDEMARRAGE</text>
  <line x1="90" y1="205" x2="810" y2="205" stroke="#444" stroke-width="3"/>
  <g font-family="monospace" font-size="27" fill="#292825">
    <text x="105" y="290">CONSIGNES PAR FONCTION :</text>
    <text x="120" y="385">- Eclairer avant de ventiler.</text>
    <text x="120" y="465">- Le degivrage suit aussitot</text>
    <text x="145" y="505">la ventilation.</text>
    <text x="120" y="585">- Le compresseur attend que les</text>
    <text x="145" y="625">trois autres circuits soient actifs.</text>
    <text x="120" y="705">- Aucun circuit ne peut etre saute.</text>
  </g>
  <rect x="92" y="790" width="716" height="190" fill="#ddd6c2" stroke="#555" stroke-width="3"/>
  <text x="450" y="855" text-anchor="middle" font-family="monospace" font-size="25" fill="#292825">NE PAS SE FIER A LA POSITION</text>
  <text x="450" y="900" text-anchor="middle" font-family="monospace" font-size="25" fill="#292825">DES COMMANDES DANS LE COFFRET.</text>
  <text x="450" y="945" text-anchor="middle" font-family="monospace" font-size="25" fill="#292825">UTILISER LE RELEVE DES ETIQUETTES.</text>
  <text x="450" y="1065" text-anchor="middle" font-family="cursive" font-size="31" fill="#7b1111" transform="rotate(-2 450 1065)">Verifier les reperes avant toute manoeuvre.</text>
</svg>
