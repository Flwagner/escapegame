<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#cec8b8"/>
  <rect x="48" y="48" width="804" height="1104" fill="#f0ead9" stroke="#34322d" stroke-width="5"/>
  <text x="450" y="120" text-anchor="middle" font-family="monospace" font-size="38" font-weight="bold" fill="#272520">RAPPORT IR-24</text>
  <text x="450" y="168" text-anchor="middle" font-family="monospace" font-size="24" fill="#7b1616">INCIDENT RAIL / CORRECTIF</text>
  <g font-family="monospace" font-size="25" fill="#292722">
    <text x="105" y="265">CONSTAT :</text>
    <text x="125" y="325">La coupure electrique anticipee a</text>
    <text x="125" y="365">ferme la purge sous pression et libere</text>
    <text x="125" y="405">deux crochets avant freinage.</text>
    <text x="105" y="505">CORRECTIF OBLIGATOIRE :</text>
    <text x="125" y="575">- Immobiliser d'abord le mouvement</text>
    <text x="150" y="615">par l'arret d'urgence.</text>
    <text x="125" y="685">- Evacuer ensuite toute la pression.</text>
    <text x="125" y="755">- Bloquer mecaniquement les crochets</text>
    <text x="150" y="795">avant d'isoler l'electricite.</text>
  </g>
  <rect x="105" y="880" width="690" height="135" fill="#ecd9c9" stroke="#831a1a" stroke-width="5"/>
  <text x="450" y="935" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#831a1a">LA REVISION 2018 EST ANNULEE</text>
  <text x="450" y="980" text-anchor="middle" font-family="monospace" font-size="23" fill="#831a1a">CORRECTIF APPLICABLE IMMEDIATEMENT</text>
</svg>
