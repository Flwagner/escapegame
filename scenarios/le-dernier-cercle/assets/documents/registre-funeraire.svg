<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
  <title id="title">Registre funéraire Valombre</title>
  <desc id="desc">Trois lignes donnent les dates et âges d'Élise, Lucien et Margot, sans symbole rituel.</desc>
  <rect x="25" y="25" width="1050" height="750" fill="#cbc09e" stroke="#5d5343" stroke-width="12"/>
  <g stroke="#756a56" stroke-width="4"><path d="M70 180h960M70 350h960M70 520h960M70 690h960M410 180v510M825 180v510"/></g>
  <g fill="#312d27" font-family="Courier New,monospace">
    <text x="550" y="110" text-anchor="middle" font-size="48">REGISTRE DU CAVEAU VALOMBRE</text>
    <text x="185" y="155" font-size="27">NOM</text><text x="560" y="155" font-size="27">DATES</text><text x="895" y="155" font-size="27">VEILLE</text>
    <text x="125" y="282" font-size="42">ÉLISE</text><text x="475" y="282" font-size="42">1898—1916</text><text x="900" y="282" font-size="42">18 ans</text>
    <text x="125" y="452" font-size="42">LUCIEN</text><text x="475" y="452" font-size="42">1879—1906</text><text x="900" y="452" font-size="42">27 ans</text>
    <text x="125" y="622" font-size="42">MARGOT</text><text x="475" y="622" font-size="42">1906—1917</text><text x="900" y="622" font-size="42">11 ans</text>
  </g>
</svg>
